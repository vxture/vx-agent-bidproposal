# pnpm workspace roots. The app profile roots packages under portals/, per the
# governance source-directory slots: portals/app is the Next.js application
# (@bidproposal/app) and portals/packages/* holds shared workspace packages
# (@bidproposal/shared).
packages:
  - "portals/*"
  - "portals/packages/*"

# The shared server adapter uses a real encrypted SQLite native binding.
allowBuilds:
  better-sqlite3-multiple-ciphers: true
